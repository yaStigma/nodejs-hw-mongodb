tags:
  - Auth
summary: Login a user
operationId: loginUser
description: 'Authenticate a user with email and password'
security:
  - bearerAuth: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            description: 'Email of the user'
            type: string
            format: email
            example: 'LeviA@mail.com'
          password:
            type: string
            format: password
            description: User's password
            example: 'Password123'

responses:
  '200':
    description: Successfully logged in
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully logged in an user!
            data:
              type: object
              $ref: '../../../components/schemas/auth.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
