tags:
  - Auth
summary: Refresh access token
operationId: refreshToken
description: 'Refresh the access token using a valid refresh token'
security:
  - bearerAuth: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - refreshToken
        properties:
          refreshToken:
            type: string
            description: Valid refresh token
            example: 'k/ypQ791AB7AW7AQGDDkg0QiW1yR8hqJh9EMaPuN'

responses:
  '200':
    description: Successfully refresh session
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully refresh session
            data:
              type: object
              $ref: '../../../components/schemas/auth.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
