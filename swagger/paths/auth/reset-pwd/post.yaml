tags:
  - Auth
summary: Reset password a user
operationId: resetPasswordUser
description: 'Сhange user password'
security:
  - bearerAuth: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - token
          - password
        properties:
          token:
            description: 'JWT token'
            type: string
            example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI2NzRjYzEwYWJmYmNhZDFhYTliMmI3OTgiLCJlbWFpbCI6Inlhc3RpZ21hQGdtYWlsLmNvbSIsImlhdCI6MTczMzE1NzgxOSwiZXhwIjoxNzMzMTU4NzE5fQ.XOwVzlVdKOVTJzTDDOEK7M1aozE3HOPKFZ7ij9cKbjk'
          password:
            type: string
            format: password
            description: NEW user password
            example: 'newPassword2024'

responses:
  '200':
    description: Password has been successfully reset.
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Password has been successfully reset.
            data:
              type: object
              $ref: '../../../components/schemas/auth.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
