tags:
  - Auth
summary: Send email user
operationId: reguestResetEmail
description: 'Sending a letter to change the user password'
security:
  - bearerAuth: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
        properties:
          email:
            description: 'Email of the user'
            type: string
            format: email
            example: 'LeviA@mail.com'
responses:
  '200':
    description: Reset password email has been successfully sent.
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Reset password email has been successfully sent.
            data:
              type: object
              $ref: '../../../components/schemas/auth.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
